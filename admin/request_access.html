<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ADMIN Request Access</title>
  </head>

    <!--Footer - flex flex-col min-h-screen is here to keep footer at bottom of the browser window-->
  <body class="flex flex-col min-h-screen bg-hero bg-cover bg-center bg-fixed font-inter text-white">

     <!--To Top Gradient for background-->
    <div class="fixed inset-0 top-[30vh] bg-linear-to-t from-[#0C0C0C] from-50% to-transparent to-100%"></div>

    <script type="module" src="/src/main.ts"></script>

    <!--Footer - flex-1 used in conjuction with body flex to push content downward-->
    <!--footer must be under this div-->
    <div class="flex-1 relative z-10">

        <header class="max-w-5xl mx-auto px-5 py-3 min-h-40 flex">
        <div class="flex flex-col items-center sm:items-end w-full">
            <p class="self-end mb-2 sm:mt-2 tracking-wider text-xs bg-black p-2 rounded-sm">Request access to get started !</p>

            <div class="flex flex-col items-center w-full flex-1 sm:flex-row sm:justify-between sm:items-center">
            <div>
                <a href="../index.html"><img class="mb-10" src="../public/images/logo.svg" alt="Matt Likes Stacks Logo" /></a>
            </div>

            </div>
        </div>
        </header>

        <section class="max-w-sm mx-auto mt-3 p-5">
        <div class="min-h-full bg-black rounded-4xl p-7">

            <div class="flex flex-col gap-3 items-center ">
                <h1 class="font-normal text-lg sm:text-lg tracking-wider">ADMIN Access Request</h1>

                <form action="" method="post" class="flex flex-col gap-4 pb-3">
                    
                    <div class="flex flex-col gap-2">
                      <p class="text-xlight-purple text-sm tracking-wider">Name</p>
                      <input type="text" name="name" placeholder="" class="border border-amber-50 bg-white text-gray-500 p-1 rounded-sm">  

                      <p class="text-xlight-purple text-sm tracking-wider mt-4">Email</p>
                      <input type="text" name="email" placeholder="" class="border border-amber-50 bg-white text-gray-500 p-1 rounded-sm">  
                    </div>
        
                    <button class="bg-light-purple w-full p-2 pb-3 mt-5 rounded-full cursor-pointer">Request</button>

                    <div class="flex flex-row items-center gap-3" aria-hidden="true">
                        <span class="h-px flex-1 bg-gray-400/40"></span>
                        <span class="test-sm text-gray-400 tracking-wider">or</span>
                        <span class="h-px flex-1 bg-gray-400/40"></span>
                    </div>

                    <a href="login.html" class="flex flex-row m-auto text-sm tracking-wider mt-2 hover:text-light-purple">Login</a>
                </form>
            </div>
        </div>
        </section>
    </div>

    <footer class="relative z-10 w-full h-45 sm:h-20 p-6 bg-darkest-purple">

      <div class="flex flex-col space-y-6 sm:space-y-1 sm:grid sm:grid-cols-[1fr_auto_1fr] max-w-5xl mx-auto justify-center items-center tracking-wider">
        <a href="https://github.com/mattdrmmnd" target="_blank" rel="noopener noreferrer" class="col-start-1 justify-self-start transition-colors hover:text-orange-200 text-xs" aria-label="Visit Matt's Github repository.">
          <img src="/public/images/github_logo_footer.svg" class="h-8" />
        </a>

        <p class="col-start-2 text-center text-orange-200">Matt Likes Stacks | 2027</p>
        <a href="https://optmzd.net" target="_blank" rel="noopener noreferrer" class="col-start-3 justify-self-end transition-colors hover:text-orange-200 text-xs">Powered by OPTMZD</a>
      </div>

    </footer>
   
  </body>
</html>
